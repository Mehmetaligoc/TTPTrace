[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ttptrace"
version = "0.1.0"
description = "MITRE ATT&CK technique recognition experiment tooling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Mehmet Ali Göç" }
]

[project.scripts]
ttptrace = "ttptrace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

